<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Our Date ❤️</title>
<style>
body{
 margin:0;font-family:Arial,sans-serif;
 background:linear-gradient(135deg,#fff0f6,#eef7ff);
 min-height:100vh;display:flex;align-items:center;
 justify-content:center;color:#292747;
}
.card{
 width:90%;max-width:420px;background:white;
 padding:30px 20px;border-radius:28px;
 box-shadow:0 20px 60px #0002;text-align:center;
}
.heart{font-size:65px}
h1{font-size:30px}
button{
 border:0;border-radius:15px;padding:15px;
 margin:6px;font-size:16px;font-weight:bold;
 cursor:pointer;
}
.yes{background:#ff5c8a;color:white}
.no{background:#eee;color:#555;position:relative}
.option{background:#f5f5f7;width:44%}
.selected{background:#ffe5ef;border:2px solid #ff5c8a}
.next{background:#292747;color:white;margin-top:20px}
.grid{display:flex;flex-wrap:wrap;justify-content:center}
.hidden{display:none}
.small{color:#888;font-size:13px}
</style>
</head>

<body>
<div class="card">

<section id="one">
<div class="heart">❤️</div>
<h1>Hey You❤️</h1>
<p>I have an important question for you.</p>
<h2>Hello Love, will you go on a date with me? 😏❤️</h2>
<button class="yes" onclick="show('two')">YES ❤️</button>
<button class="no" onclick="nope(this)">NO 😏</button>
<p class="small">Find me in your heart % ✈️</p>
</section>

<section id="two" class="hidden">
<div class="heart">🥞</div>
<h1>Choose our food</h1>
<p>What should we eat?</p>

 
<div class="grid">
<button class="option" onclick="food(this,'Dosa')">🥞 Dosa</button>
<button class="option" onclick="food(this,'Idly')">⚪ Idly</button>
<button class="option" onclick="food(this,'Ice Cream')">🍦 Ice Cream</button>
<button class="option" onclick="food(this,'Coffee')">☕ Coffee</button>
<button class="option" onclick="food(this,'Pani Puri')">🥣 Pani Puri</button>
<button class="option" onclick="food(this,'Veg Meals')">🍛 Veg Meals</button>
</div>
 
<button class="next" onclick="next()">Continue →</button>
</section>

<section id="three" class="hidden">
<div class="grid">
<button class="option" onclick="vibe(this,'Sunrise at the Beach')">🌅 Sunrise at Beach</button>
<button class="option" onclick="vibe(this,'Sunset at the Beach')">🌇 Sunset at Beach</button>
<button class="option" onclick="vibe(this,'Dinner Date')">🍽️ Dinner Date</button>
<button class="option" onclick="vibe(this,'Movie / Theatre')">🎬 Movie / Theatre</button>
<button class="option" onclick="vibe(this,'Trip Together')">✈️ Trip Together</button>
<button class="option" onclick="vibe(this,'Coffee & Long Talks')">☕ Coffee & Long Talks</button>
<button class="option" onclick="vibe(this,'Ice Cream Walk')">🍦 Ice Cream Walk</button>
<button class="option" onclick="vibe(this,'Night Drive')">🌃 Night Drive</button>
<button class="option" onclick="vibe(this,'Rainy-Day Date')">☔ Rainy-Day Date</button>
<button class="option" onclick="vibe(this,'Shopping + Food Date')">🛍️ Shopping + Food Date</button>
<button class="option" onclick="vibe(this,'You Choose')">❤️ You Choose</button>
</div>

<p>📅 When should we go?</p>
<input type="date" id="dateChoice" class="datePicker">

<button class="next" onclick="finish()">Submit ❤️</button>
</section>

<section id="four" class="hidden">
<div class="heart">🥰</div>
<h1>It's a date!</h1>
<p id="result"></p>
<p class="small">Date plan submitted ❤️</p>
</section>

</div>

<script>
let selectedFood="";
let selectedVibe="";
let selectedDate="";

let noClicks=0;

function nope(btn){
 noClicks++;

 const messages=[
  "Are you sure? 😏",
  "Think again 😂",
  "Wrong button! ❤️",
  "Nice try! 😌",
  "The NO button is shy 🙈"
 ];

 document.getElementById("noMessage").textContent =
 messages[Math.min(noClicks-1,messages.length-1)];

 btn.style.position="fixed";

 const maxX=Math.max(10,window.innerWidth-btn.offsetWidth-10);
 const maxY=Math.max(10,window.innerHeight-btn.offsetHeight-10);

 btn.style.left=Math.floor(Math.random()*maxX)+"px";
 btn.style.top=Math.floor(Math.random()*maxY)+"px";

 if(noClicks>=5){
  btn.textContent="YES ❤️";
  btn.className="yes";
  btn.onclick=function(){show('two')};
 }
}

function show(id){
 document.querySelectorAll("section")
 .forEach(x=>x.classList.add("hidden"));
 document.getElementById(id).classList.remove("hidden");
}

function food(btn,value){
 document.querySelectorAll("#two .option")
 .forEach(x=>x.classList.remove("selected"));
 btn.classList.add("selected");
 selectedFood=value;
}

function vibe(btn,value){
 document.querySelectorAll("#three .option")
 .forEach(x=>x.classList.remove("selected"));
 btn.classList.add("selected");
 selectedVibe=value;
}

function next(){
 if(!selectedFood){
  alert("Choose our food first ❤️");
  return;
 }
 show("three");
}

async function finish(){
 if(!selectedVibe){
  alert("Choose our date vibe ❤️");
  return;
 }

 selectedDate=document.getElementById("dateChoice").value;

 if(!selectedDate){
  alert("Please choose a date 📅❤️");
  return;
 }

 const formData = new FormData();
 formData.append("_subject","Date Response ❤️");
 formData.append("Name","Hello Love");
 formData.append("Food",selectedFood);
 formData.append("Date Plan",selectedVibe);
 formData.append("Date",selectedDate);
 formData.append("Submitted At",new Date().toLocaleString());

 try{
  const response = await fetch("https://formspree.io/f/xdekolyw",{
   method:"POST",
   body:formData,
   headers:{
    "Accept":"application/json"
   }
  });

  if(!response.ok){
   alert("Something went wrong while sending your response 😢");
   return;
  }

  localStorage.setItem(
   "dateResult",
   JSON.stringify({
    food:selectedFood,
    vibe:selectedVibe,
    date:selectedDate,
    time:new Date().toLocaleString()
   })
  );

  document.getElementById("result").innerHTML=
   "🍽️ Food: <b>"+selectedFood+
   "</b><br><br>💕 Date plan: <b>"+selectedVibe+
   "</b><br><br>📅 Date: <b>"+selectedDate+"</b>";

  show("four");

 }catch(error){
  alert("Could not send the response. Please check your internet connection ❤️");
 }
}

</script>

</body>
</html>
